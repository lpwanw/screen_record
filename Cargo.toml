[package]
name = "taywind_record"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
block2 = "0.6"
cpal = "0.18"
dispatch2 = "0.3"
gpui = { version = "=0.3.7", package = "gpui-pre" }
gpui-component = "=0.7.0"
gpui_platform = { version = "=0.3.7", package = "gpui-pre-platform", features = ["font-kit", "runtime_shaders"] }
hound = "3"
image = { version = "0.25", default-features = false }
libc = "0.2.189"
objc2 = "0.6"
objc2-av-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"
raw-window-handle = "0.6"
screencapturekit = { version = "11", features = ["macos_15_0"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
